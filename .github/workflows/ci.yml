name: CI

# 작업은 PR로 master에 합친다. PR 브랜치 푸시마다 push와 pull_request가 겹쳐 두 번 돌지 않도록
# push는 master에만 건다.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # 서버는 리눅스에서 운영하므로 모든 검사는 리눅스에서 돌린다. 다른 운영체제에서는 결정론만 본다(아래 cross-os).
  server:
    name: 서버 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 빌드 (경고를 오류로 처리)
        run: dotnet build server/Argus.Server/Argus.Server.csproj
      - name: 서버 검사
        run: dotnet run --project tests/Argus.Server.Tests

  client:
    name: 클라이언트 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm --prefix client ci
      - name: 타입 검사와 프로덕션 빌드
        run: npm --prefix client run build

  browser:
    name: 브라우저 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm --prefix client ci
      - name: 클라이언트를 wwwroot로 빌드
        run: npm --prefix client run build
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
        working-directory: client
      - name: 서버를 띄우고 브라우저 검사
        run: |
          dotnet run --project server/Argus.Server --urls http://127.0.0.1:5077 > /tmp/argus-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5077/health > /dev/null 2>&1; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:5077/health > /dev/null 2>&1; then
            echo "서버가 응답하지 않습니다"
            cat /tmp/argus-server.log
            exit 1
          fi
          npm --prefix client run test:e2e
        env:
          ARGUS_URL: http://127.0.0.1:5077
          # 운영 방은 생성 맵이다. 임무 봇처럼 정해진 맵이 필요한 검사만 손으로 만든 맵을 고를 수 있게 한다.
          Argus__Missions__AllowHandmade: "true"
      - name: 브라우저 검사가 남긴 기록을 모두 재생
        run: |
          # 서버를 정상 종료해 방마다 기록을 끝 줄과 함께 닫는다. 백그라운드로 띄운 프로세스는 SIGINT를 무시하므로 SIGTERM을 보낸다.
          pkill -TERM -f "Argus.Server --urls http://127.0.0.1:5077" || true
          for attempt in $(seq 1 30); do
            if ! pgrep -f "Argus.Server --urls http://127.0.0.1:5077" > /dev/null; then break; fi
            sleep 1
          done
          # 실제 브라우저와 네트워크로 진행한 방이 모두 같은 상태로 재현되어야 한다. 정상 종료했으므로 모든 기록에 끝 줄이 있어야 하고
          # 진행 중 예외도 없어야 한다(--strict). 재현한 기록이 하나도 없어도 실패한다.
          dotnet run --project tools/Argus.Replay -- server/Argus.Server/recordings --strict
      # 리눅스에서 남긴 기록을 다른 운영체제에서 재생하려고 넘긴다. 시드가 들어 있지만 검사에서 쓰고 버리는 방이라 괜찮다(CLAUDE.md의 예외).
      # 실패한 작업만 다시 돌리면 같은 실행 안에서 같은 이름으로 다시 올리게 되므로 덮어쓰기를 켠다.
      # 다른 운영체제 작업만 나중에 다시 돌려도 받을 수 있게 14일 둔다.
      - name: 다른 운영체제에서 재생할 기록 올리기
        uses: actions/upload-artifact@v7
        with:
          name: recordings-linux
          path: server/Argus.Server/recordings/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      # 실패를 분석하려고 검사 방의 기록도 올린다. 시드가 들어 있지만 검사에서 쓰고 버리는 방이라 괜찮다(CLAUDE.md의 예외).
      - name: 실패 기록 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
            server/Argus.Server/recordings/
          if-no-files-found: ignore
          overwrite: true

  # 결정론의 목표는 하드웨어와 소프트웨어가 달라도 같은 결과다. Windows(x64)와 macOS(ARM64)에서 두 가지를 본다.
  # 1) 결정론 검사: 시드 난수의 고정값처럼 계산 결과 자체를 고정값과 비교하는 검사다.
  # 2) 기록 재생: 리눅스(x64) 서버가 실제 브라우저 검사로 남긴 기록을 다시 돌려, 틱마다의 상태 요약값이 기록과 같은지 본다.
  #    같은 커밋을 빌드하므로 코드 버전도 같아야 한다. 버전이 어긋나 건너뛴 기록이 있으면 --strict가 실패로 친다.
  # 실제 시간과 소켓에 기대는 나머지 검사는 공유 실행기에서 흔들리기 쉽고 서버도 리눅스에서만 운영하므로 여기서는 돌리지 않는다.
  cross-os:
    name: 다른 운영체제에서 결정론 확인 (${{ matrix.os }})
    needs: browser
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 결정론 검사
        run: dotnet run --project tests/Argus.Server.Tests -- determinism
      - uses: actions/download-artifact@v8
        with:
          name: recordings-linux
          path: recordings
      - name: 리눅스에서 남긴 기록을 이 운영체제에서 재생
        run: dotnet run --project tools/Argus.Replay -- recordings --strict
